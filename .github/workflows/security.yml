name: Security

# Supply-chain hardening: vulnerability scanning (CIP-010-R3) and SBOM
# generation (supply-chain transparency). Runs on every push/PR to main.
#
# Jobs:
#   vulnerability-scan  - pip-audit, BLOCKING (fails build on any real CVE).
#                         scripts/run-pip-audit.sh audits BOTH dependency sets
#                         the image ships: the installed environment
#                         (requirements-dev.lock, the image's lock plus the
#                         dev and encryption extras, and every other extra a
#                         CI workflow installs, punch 516) and the embedding
#                         runtime-deps manifest
#                         (scripts/embedding-bits-manifest.json, the
#                         set the admin Install button puts in the PHI
#                         container; punch 555), plus a teeth leg that must
#                         report a known-vulnerable fixture.
#   sbom                - cyclonedx-py CycloneDX SBOM, INFORMATIONAL (artifact only)
#
# Waivers (pip-audit --ignore-vuln <GHSA-id>) should only be added AFTER a
# finding is reviewed and accepted as acceptable-risk. Do not add preemptive
# waivers. As of initial rollout, no waivers are needed (clean scan).
#
# Actions pinned to Node 24-compatible majors (v5 of checkout/setup-python/
# upload-artifact as of 2026-04) so the Node 20 deprecation warning goes
# away. GitHub runners forced Node 24 by default 2026-06-02; this preempts
# the forced migration and silences the deprecation noise on every push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly sweep so a fresh CVE against an already-installed transitive dep
  # lands within 24h even if no push happens. Runs the SAME pip-audit path
  # (scripts/run-pip-audit.sh — the SSOT waiver list applies uniformly to
  # push, PR, nightly, and the pre-push hook per `feedback_dependency_
  # freshness_audit_at_push`). GH marks the run failed on any real CVE →
  # visible in the Actions tab + email on failure per user's notification
  # settings. Complements the Dependabot weekly PR sweep (.github/
  # dependabot.yml) — Dependabot bumps toward fixes; this catches regressions
  # between bump waves.
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily (~02:17 EDT / ~01:17 EST)
  workflow_dispatch: {}    # manual re-run on demand

# Least privilege, declared explicitly. Under a repo default of read-only this
# changes nothing today; it exists so that RAISING the repo-wide default (which
# ci-green-ref.yml needs in order to write its marker branch) cannot silently
# hand write access to a workflow that never asked for it.
permissions:
  contents: read

jobs:
  vulnerability-scan:
    name: pip-audit (CVE scan)
    # Self-hosted by default (feedback_ci_deploy_host_runner_for_non_arm64) — pip-only
    # flow, no sudo/daemon. Publish sanitize-map rewrites the label to
    # `ubuntu-latest` for the public mirror (no self-hosted runners there).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install project
        # Lockfile first so the audit / SBOM run against pinned
        # transitive versions, not whatever pyproject's ranges
        # resolve to today. Editable install of the project itself
        # uses --no-deps so the lock isn't overridden.
        run: |
          # Punch 623 (register N-607 residual b): pip, setuptools and
          # pip-audit come from requirements-ci-tools.lock, hashed, before
          # anything else, instead of `--upgrade pip`, `--upgrade setuptools`
          # and `pip install pip-audit` from PyPI unhashed. The upgrade still
          # matters: the self-hosted runner's Python toolcache ships a stale
          # setuptools (66.1.1 on the deploy host runner, 5 PYSEC findings, e.g.
          # PYSEC-2026-3447 fixed in 83.0.0) and pip-audit audits the
          # ENVIRONMENT. --no-deps: the lock carries every dependency, and its
          # shared pins equal the dev lock's (punch-511 pin C1), so it cannot
          # move an audited version.
          python -m pip install --require-hashes --no-deps -r requirements-ci-tools.lock
          # Punch 516: leg 1 audits every package any CI workflow installs,
          # not only what the image ships. requirements-dev.lock is the
          # image's lock plus the dev, encryption and e2e extras at the SAME
          # versions (punch 511 pin D1), hashed and wheel-only: the set
          # tests.yml and e2e.yml install. Since punch 622 the e2e extra
          # (Playwright) is in it, so there is no unhashed `.[e2e]` install
          # and no re-pin after one. The image's own installed set is audited
          # separately at deploy (run-pip-audit.sh --installed-set).
          # Derived-set pin: tests/test_embedding_manifest_audit_pin.py::
          # test_every_extra_ci_executes_is_in_the_audited_environment.
          # The sbom job below installs only the image lock and the CI tools
          # lock: it describes the shipped set plus the CI tools (pip-audit,
          # cyclonedx-bom and their dependencies), as it listed cyclonedx-bom's
          # own dependencies before punch 623.
          pip install --require-hashes -r requirements-dev.lock
          # --no-build-isolation (panel O F3): the build backend is the hashed
          # setuptools the tools lock just installed (84.2.1; [build-system]
          # needs >=78.1.1), not one pip fetches unhashed into an isolated env.
          pip install --no-deps --no-build-isolation -e .

      - name: Vulnerability scan
        # --skip-editable skips the project's own editable install from the
        # vuln-lookup pass (the project is private, not on PyPI — pip-audit
        # can't resolve it).
        #
        # --strict was removed: under --strict, pip-audit treats any
        # dep-collection failure (including "couldn't resolve editable
        # install") as a build failure even when --skip-editable handles
        # the skip cleanly. Without --strict, pip-audit still exits
        # non-zero on any REAL CVE finding — which is what we want the
        # build to fail on.
        #
        # Net behavior: no CVE → exit 0. Real CVE → exit 1 → build fails.
        # Editable-install note → exit 0 (noted in output as "Skip Reason").
        # pip-audit is installed, hashed, by the step above (punch 623).
        run: |
          # Run via the canonical script so local pre-push hook + CI
          # use the exact same invocation. Waivers live in that script
          # so a single PR review approves them once for all surfaces.
          ./scripts/run-pip-audit.sh

      - name: Verify embedding manifest hashes against their publishers
        # Punch 555 (DA-555-2): the installer compares wheel bytes against the
        # manifest, i.e. against itself, so a hand-edited or merge-resolved
        # hash would pass every other gate. This re-derives each wheel's
        # sha256 from its publisher (PyPI JSON / the pytorch index) and fails
        # on any mismatch or unverifiable entry. Metadata only, no downloads.
        run: python scripts/build-embedding-bits-manifest.py --verify-publishers

  sbom:
    name: CycloneDX SBOM
    # Self-hosted by default (feedback_ci_deploy_host_runner_for_non_arm64) — pip +
    # artifact upload only. Publish sanitize-map rewrites the label to
    # `ubuntu-latest` for the public mirror (no self-hosted runners there).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install project
        # Lockfile first so the audit / SBOM run against pinned
        # transitive versions, not whatever pyproject's ranges
        # resolve to today. Editable install of the project itself
        # uses --no-deps so the lock isn't overridden.
        run: |
          # Punch 623: pip, setuptools and cyclonedx-bom come from
          # requirements-ci-tools.lock, hashed, before anything else (see the
          # scan job above). Then the image lock with hash checking explicit.
          python -m pip install --require-hashes --no-deps -r requirements-ci-tools.lock
          pip install --require-hashes -r requirements.lock
          # --no-build-isolation: build with the tools lock's hashed setuptools
          # (see the scan job above).
          pip install --no-deps --no-build-isolation -e .

      - name: Generate SBOM
        # cyclonedx-bom is installed, hashed, by the step above (punch 623).
        run: |
          cyclonedx-py environment -o sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v5
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
