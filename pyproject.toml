[build-system]
requires = ["setuptools>=78.1.1"]  # >=78.1.1: PYSEC-2025-49 (build-env path-traversal RCE)
build-backend = "setuptools.build_meta"

[project]
name = "email-triage"
version = "0.2.0"
description = "Portable email triage system with LLM classification and configurable routing"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    # Starlette is FastAPI's ASGI core (normally transitive via fastapi).
    # Pinned explicitly >=1.3.1 for CVE-2026-54283 (request.form() field/
    # size-limit bypass DoS — reachable via our form routes). Push forward,
    # never pin fastapi back. NOTE 1.3.1 newly ENFORCES form-parser limits.
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.31",  # >=0.0.31: CVE-2026-53538/53539/53540 (form-parse DoS)
    "itsdangerous>=2.2.0",
    # 2.14.0 clears the 2026-09 advisory batch against 2.13.0: CVE-2026-102268
    # (CRITICAL — mutated-PEM detection bypass lets a public key be accepted as
    # an HMAC secret → HS/asymmetric key confusion → token forgery) plus
    # CVE-2026-101917/102265/102266/102267/102269/102271/102272/102273/102274.
    # OSV reports 2.14.0 clean of every tracked advisory. The floor is 2.15.1, the
    # newest release (push forward, never pin back). Two measured differences
    # support it; neither is known to be reachable from our only token source,
    # the Google Pub/Sub push JWT, so both are defense-in-depth:
    #  (1) on 2.14.0 a JWT payload nested ~5000 deep escapes jwt.decode() as a raw
    #      RecursionError (not a PyJWTError, so it would bypass the handler in
    #      web/gmail_push_auth.py); 2.15.x raises DecodeError. It is reachable only
    #      after signature verification, so only a validly signed token triggers it.
    #  (2) 2.15.0 alone rejects trailing Base64URL "=" padding; 2.15.1 restores it.
    # requirements.lock is what the image installs (Containerfile installs the
    # project --no-deps), so the lock is the remediation and this floor is the
    # forward guard; tests/test_n542_lock_satisfies_pyproject_floors_ssot_pin.py keeps
    # the two in step. Register: N-542, docs/registers/pyjwt-cve-2026-102268-*.md.
    "pyjwt[crypto]>=2.15.1",
    # >=2.8.0 (punch 554, 2026-09-30): urllib3 2.7.0 carries three advisories, all fixed
    # in 2.8.0 (OSV CVE records 2026-09-29; GHSA 2026-09-30): GHSA-8988-9cw3-xx77 / CVE-2026-97687 (HIGH:
    # HTTPS-proxy TLS configuration could be ignored or overridden), GHSA-vxq7-64xx-v4gw /
    # CVE-2026-97689 (HIGH: HTTPResponse.stream()/read_chunked() buffered an unbounded
    # chunk-size line) and GHSA-gh4c-6fx4-qh6g / CVE-2026-97688 (MEDIUM: chunked-deflate
    # infinite loop). Not imported by src; it arrives through requests, used only by msal and acme. A
    # transitive dependency named here only to carry the floor: the lock is the
    # remediation, this floor is the forward guard, and
    # tests/test_n542_lock_satisfies_pyproject_floors_ssot_pin.py keeps them in step.
    # Register: N-548.
    "urllib3>=2.8.0",
    # >=2026.10.19 (2026-10-20): certifi bundles the emSign ECC Root CA - G3 root, whose
    # eMudhra intermediate CA keys are compromised, so a holder of those
    # keys can mint certificates every certifi-trusting client accepts (GHSA-6q48-6c7w-
    # 9gw2, CRITICAL, CWE-295, published 2026-10-20). Affected range: the GHSA text says
    # before 2026.10.18; GitHub's structured range says >=2019.03.09, <2026.10.19
    # (2026.10.18 removed every emSign root; 2026.10.19 restored the unaffected C1, C3
    # and G1). Not imported by src; it is the CA bundle httpx/httpcore and
    # requests (msal, acme) verify against. A transitive dependency named here only to
    # carry the floor: the lock is the remediation, this floor is the forward guard, and
    # tests/test_n542_lock_satisfies_pyproject_floors_ssot_pin.py keeps them in step.
    # Register: N-621.
    "certifi>=2026.10.19",
    # >=7.1.3: CVE-2026-55099 (HIGH, CVSS 7.5) — quadratic Component.__eq__ over
    # nested subcomponents in src/icalendar/cal/component.py; affects 7.1.0 until
    # 7.1.3. Verified against NVD 2026-08-25, published 20:16Z the same day.
    # Minimal floor raise: the CVE range is the whole justification. Do NOT
    # cite feedback_push_forward_not_pin_old here — its trigger is a version
    # CONFLICT, which never fired, and it was misapplied in an earlier draft.
    "icalendar>=7.1.3",
    #  Regulatory clock awareness: OFFLINE natural-language date arithmetic
    # for the safety-reporting detector (the LLM proposes a deadline/anchor
    # PHRASE; dateparser resolves it to a date with RELATIVE_BASE — the LLM
    # never computes a date). No network use.
    "dateparser>=1.2",
    # Auth-surface upgrade: dev-keypair + WebAuthn + ACME automation.
    # cryptography was previously transitive via pyjwt[crypto]; promoting
    # to direct dep because dev_keypair + acme_renewer use it directly.
    "cryptography>=50.0.2",  # >=50.0.2: wheels bundle OpenSSL 4.0.3, clearing CVE-2026-84783 (X.509 extension-cache use-after-free) + CVE-2026-84782 (DTLS) in the 4.0.2 that 50.0.1 bundled. >=50.0.0: clears CVE-2026-69247 (PKCS#7 Bleichenbacher oracle, fix 50.0.0) + CVE-2026-69248/69249 (X.509 name-constraint escape + path-build DoS, fix 49.0.0). Prior >=48.0.1: GHSA-537c-gmf6-5ccf (bundled-OpenSSL OOB read).
    # WebAuthn / FIDO2 hardware-key auth (Duo's library, BSD).
    "webauthn>=2.0",
    "pyasn1>=0.6.5",  # CVE-2026-59885/59886 + CVE-2026-119194..119197 fix (webauthn transitive via pyasn1)
    # ACME client (Let's Encrypt) + JOSE for protocol-level signing.
    # Same library certbot uses internally.
    "acme>=2.10",
    "josepy>=1.14",
    # DNS-01 challenge needs dnspython for RFC-2136 (TSIG-signed dynamic
    # updates against the operator's BIND).
    "dnspython>=2.9.0",
    # Punch 537 / DB-P3-6 (panel 3): these three were transitive-only while
    # src/ imports them DIRECTLY, which the 537 pin now treats as a violation
    # by design — a transitive dependency can be dropped by its provider's next
    # release without any change here. Each floor is the floor its provider
    # ALREADY requires, so declaring it cannot move resolution: that is why
    # requirements.lock stays byte-identical (verified by sha256 before/after)
    # and no regeneration is owed. Each is already locked as a transitive
    # (markupsafe==3.0.3, pydantic==2.13.4, requests==2.34.2).
    "markupsafe>=2.0",   # already installed transitively via jinja2; declared because src/ imports it directly (punch 537, DB-P3-6) — web/csrf.py, routers/help.py, routers/ui/_shared.py x2, routers/ui/admin.py
    "pydantic>=2.9.0",   # already installed transitively via fastapi; declared because src/ imports it directly (punch 537, DB-P3-6) — routers/agent_api.py, routers/api.py
    "requests>=2.25.1",  # already installed transitively via acme; declared because src/ imports it directly (punch 537, DB-P3-6) — from punch 547 on its only importer is the _egress.py SSOT (web/acme_renewer.py before 547)
    # Vector math for the M-4 sent-mail RAG cosine hot-path. Pure
    # Python cosine over ~10k rows x 768 dims is seconds per draft reply
    # and blocks the event loop. numpy + precomputed L2 norms get the
    # per-call cost into the millisecond range.
    "numpy>=1.26",
    # Timeout-bounded regex engine (PyPI ``regex``) for operator-authored
    # SUBJECT rule patterns in ``classify/hints.py``. Stdlib ``re`` has no
    # per-call timeout and a pathological pattern (e.g. ``(a|aa)+$``)
    # against a long subject pegs the worker thread until catastrophic
    # backtracking finishes. ``regex.search(..., timeout=1.0)`` raises
    # TimeoutError instead. Bounded threat model: rules are operator-
    # authored via admin UI, not external input — but admin typo or
    # curiosity-test of an evil regex is still a foot-gun we close here.
    "regex>=2024.0",
    # v0.1.2 single-file encryption: SQLAlchemy Core 2.x engine
    # factory + connection pool. NOT ORM — hand-tuned SQL with qmark ``?``
    # params is retained at every callsite. SA Core is the engine/pool layer
    # only; the ``WriterBackend`` Protocol sits on top of it. (Alembic, the
    # migration scaffolding on the same seam, is in the dev extra below.)
    # Rationale: ``internal documentation`` §0 + §2.
    # Forward-compat seam: v0.2.0  Postgres retrofit swaps the
    # engine URL + ``WriterBackend`` impl (``AsyncpgWriterPool``) with
    # zero callsite changes per §7.
    "sqlalchemy>=2.0",
    # ``packaging`` for PEP-440 Version parsing. Required transitive of
    # ``transformers`` (``transformers.utils.versions`` does ``from packaging
    # import version`` at module load) via the embedding_bits install path;
    # declared direct so a stripped prod venv on the deploy host can't raise uncaught
    # ImportError at first model load. Also imported directly by
    # ``src/email_triage/update_check.py`` (``from packaging.version import
    # InvalidVersion, Version``). (Formerly also served cve-arc's D-gate
    # Version compare; that tool was extracted to C-Doe/cve-arc 2026-07-31.)
    "packaging>=24.0",
]

[project.optional-dependencies]
keyfile = ["cryptography>=50.0.2"]
keyring = ["keyring>=25.0.0"]
# v0.1.2 single-file encryption + N-432 Path-3 hybrid (2026-07-20): SQLCipher
# single-file encryption-at-rest, UNIFIED across arches (superseded the
# per-arch  split — the Containerfile now source-builds ``sqlcipher3``
# on BOTH x86_64 and aarch64 from the coleifer sdist with a freshly-
# generated SQLCipher v4.20.0 amalgamation, SQLite 3.54.1 — a
# walresetbug-clean SQLCipher). Prior x86_64 pin ``sqlcipher3-binary>=0.5.4,<0.6``
# vendored SQLCipher 4.6.0 = SQLite 3.45.3 — UNPATCHED for walresetbug on
# the actual prod arch; Path-3 closes that on BOTH arches uniformly.
# ``sqlcipher3`` here is the first-party coleifer project (Charles Leifer) —
# NOT the deprecated rigglemania ``pysqlcipher3`` (2019, no 3.11+) and NOT
# a third-party republish. It exposes ``import sqlcipher3`` with AES-256-CBC
# + HMAC-SHA512 (SQLCipher 4.x, cipher_compatibility=4), IDENTICAL on-disk
# format across arches so a DB written on one arch opens unchanged on the
# other (zero migration; Zetetic 4.x-major-format-compatibility contract).
# The Containerfile install uses ``--no-binary sqlcipher3 --no-build-isolation``
# to force the source build against our SHA-pinned amalgamation (skips the
# sdist's conan build-require whose OpenSSL 3.6.0 rebuild aborts
# under QEMU; setup.py links Debian's -lcrypto from libssl-dev instead).
# Decision docs: internal documentation +
# STATE_2026-07-20_0030_edt_walresetbug_path3_containerfile_drafted.md.
# Linux/container ONLY (no Windows wheel). Required only when
# persistence.encryption_enabled is ON; rest of the codebase imports cleanly
# without it (boot fail-closes if encryption is requested but module absent).
encryption = [
    "sqlcipher3==0.6.5",
]
imap = ["aioimaplib>=1.1.0"]
office365 = ["msal>=1.30.0"]
#  — optional Redis-backed classification cache. Operator paste a
# Redis URL into /admin/integrations to enable. ``valkey`` (Linux
# Foundation fork) speaks the identical wire protocol and works with
# the same client unchanged — no library change is needed.
cache = ["redis>=5.0"]
# In-process CPU embedding backend (M-4 / M-5). Pulls sentence-
# transformers + the torch CPU stack into the install. Used when
# the install's primary GPU is saturated by the chat model and a
# co-resident embedder would thrash VRAM. Model files download
# once on first use into the container's HF cache; no network
# traffic after that. Privacy posture: local-only by design, same
# allowlist gate as the Ollama backend; the call never leaves the
# container.
embedding = [
    # Punch 563: 6.1.0 is the floor the embedding-bits manifest pins (punch
    # 557, CVE-2026-68770) and the first API the backend calls
    # (get_embedding_dimension). >=3.0 admitted the CVE-affected 5.x line.
    "sentence-transformers>=6.1.0",
    # Pin to CPU-only torch wheel to skip the ~3 GB CUDA bundle
    # we don't need. Operators wanting GPU embedding still install
    # via the upstream torch index manually.
    "torch>=2.0",
]
dev = [
    # 9.1.0/9.1.1 lose nested-conftest fixtures on interleaved file args (pytest-dev/pytest#14964).
    # Raise the cap only with tests/test_n614_pytest_keeps_nested_conftest_fixtures_pin.py green on the new version.
    "pytest>=8.0,<9.1",
    "pytest-asyncio>=0.24",
    "httpx>=0.27.0",
    # Starlette's TestClient is built on httpx2 (Pydantic's httpx fork) as of
    # starlette 1.3.x; without it TestClient warns + falls back to httpx.
    # NOTE (punch 489, 2026-10-18): httpx2 (and httpcore2) are NOT in
    # requirements.lock; an image built from this lock does not install them
    # (the running container loses them at the next deploy). From the
    # 2026-08-26 lock until then requirements.lock carried
    # httpx2 as an openai transitive (mcp was its other parent until mcp left
    # the main dependencies, CVE-2026-59951, verified unused); the unused
    # `openai` extra was removed from pyproject, the Containerfile and
    # scripts/regen-lock.sh (nothing imports the SDK; the adapters speak httpx),
    # and httpx2 left requirements.lock with it. This dev pin now puts httpx2
    # (and httpcore2) into requirements-dev.lock only, for the TestClient.
    # (The wording before 2026-10-17 said "never in the prod image" off a TRUE
    # premise, that the lock does not compile the dev extra, and a FALSE
    # conclusion; do not restore it without re-reading the lock.)
    "httpx2>=2.4",
    # Parallel test runner — invoke via ``pytest -n auto``.
    # Cuts the full web/cache/privacy/providers sweep from
    # ~50 min to ~12-15 min on a 4-core box (4x speedup; some
    # tests serialise on shared resources so it's not strictly
    # linear). Off by default; deploy flow uses ``scripts/test-fast``
    # which invokes ``-n auto`` explicitly. Plain ``pytest`` still
    # runs serially so anyone debugging a single test isn't
    # confused by worker output.
    "pytest-xdist>=3.5",
    # tests/conftest.py takes a FileLock to serialise the file-DB audit suites across
    # xdist workers. It held only because torch happened to install filelock; declared
    # here so it holds by design (punch 537; tests/test_n537_test_imports_are_declared_pin.py).
    "filelock>=3.12",
    # tests/_portal_loop.py (punch 577) drives requests through anyio.from_thread so one
    # event loop spans the request and the audit-drain wait. Installed in prod only as an
    # httpx/starlette transitive (requirements.lock anyio==4.14.2); declared for the tests
    # by the punch-537 rule (tests/test_n537_test_imports_are_declared_pin.py).
    "anyio>=4",
    # CommonMark + GFM-table renderer used ONLY by the N-495 render-fidelity pin
    # (tests/test_n495_register_rows_survive_the_render_pin.py). The pin imports it at
    # module scope on purpose: a missing renderer must be a loud collection error, not a
    # silent skip. EXACT pin, not a range: the pin's ratchet ceilings are calibrated to
    # this renderer's output, and minor releases track CommonMark spec revisions that can
    # change what a table row renders to. Because the ceilings are maxima, a row that newly
    # survives render would pass silently and the ceiling would over-permit from then on.
    # A bump must be an explicit change that re-runs the pin; Dependabot sends it as its
    # own PR (excluded from the groups in .github/dependabot.yml). Not installed by the
    # image build (the lock excludes the dev extra); the runtime embedding lazy-install
    # pins the same 4.2.0 separately in scripts/embedding-bits-manifest.json; keep the two
    # equal (tests/test_manifest_pyproject_version_agreement_pin.py fails if they differ).
    # The dep-review gate admits this package by NAME, so this pin is the only
    # version control. The pin is not shipped to the public mirror; there this
    # dependency has no consumer.
    "markdown-it-py==4.2.0",
    # Alembic migration scaffolding for the  single-file encryption seam (alembic/,
    # alembic.ini). Dev extra only since 2026-10-17: nothing at runtime runs
    # it. The image ships neither alembic/ nor alembic.ini, schema changes run
    # through web/migrations.py, and its only user is
    # tests/test_alembic_baseline.py. As a main dependency it put alembic and
    # mako (a template engine only alembic pulls in) into the production
    # image with no consumer (installed-but-unused audit, 2026-10-17).
    "alembic>=1.13",
]
# Browser end-to-end harness (tests/e2e). Kept OUT of ``dev`` so the
# normal unit run neither needs Playwright nor downloads a browser; the
# e2e suite is opt-in via ``scripts/test-e2e.sh`` + the dedicated CI job.
# After installing: ``playwright install chromium``.
e2e = [
    "pytest-playwright>=0.5",
    "playwright>=1.49",
]
# The CI tool set (punch 623, register N-607 residual b): what the security workflow's
# CVE-scan and SBOM jobs bootstrap. scripts/regen-lock.sh compiles it, with hashes,
# into requirements-ci-tools.lock, which those jobs install with --require-hashes
# instead of `pip install --upgrade pip` / `pip install pip-audit` from PyPI unhashed.
# Never installed by the image (requirements.lock) or the unit/e2e jobs.
# pip: the image's own pip (requirements-pip.txt) is the version the regen pins.
# setuptools: the floor [build-system] names; the scan audits the environment, so a
# stale runner setuptools would fail it.
ci = [
    "pip>=26.2.2",
    "setuptools>=78.1.1",
    "pip-audit>=2.7",
    "cyclonedx-bom>=4.0",
]

[project.scripts]
email-triage = "email_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "openclaw/skills/email-triage-api/tests"]
# The browser e2e suite (tests/e2e) is opt-in: it needs Playwright + a
# downloaded browser and boots a real server, so the default run IGNORES
# it (no accidental browser launch, no import error when the e2e extra
# isn't installed). Run it explicitly via ``scripts/test-e2e.sh`` (which
# clears this with ``-o addopts=``) or the CI e2e job.
addopts = "--ignore=tests/e2e"
markers = [
    "e2e: browser end-to-end test (boots a real server; opt-in, not in the default run)",
]
# Test-harness warnings gate (internal documentation, step 4). The
# full-suite audit (2026-06-13, `-W default`) found exactly THREE warning
# categories: RuntimeWarning (0 — no never-awaited coroutine), DeprecationWarning
# (2 distinct, both third-party, allow-listed below), and ResourceWarning (591 —
# pervasive test-fixture DB-handle hygiene; see note).
filterwarnings = [
    # THE GATE — a NEW DeprecationWarning or RuntimeWarning from OUR code is real
    # signal: FAIL it, so a future framework/stdlib deprecation we introduce, or
    # a never-awaited coroutine (a correctness smell), can't scroll past unseen.
    # (pytest applies LATER filters with higher priority, so the message-scoped
    # ``ignore``s below override these for their exact, known messages only.)
    "error::DeprecationWarning",
    "error::RuntimeWarning",
    # --- KNOWN / ACCEPTED, scoped to the exact message so they cannot mask any
    # OTHER warning of the same category ---
    # bucket 3 — Starlette TestClient per-request ``cookies=`` (~832 call sites
    # across 77 files that switch identity admin/user/anon PER REQUEST; the proper
    # fix — per-identity client cookie jars — is a large, tracked refactor).
    "ignore:Setting per-request cookies=:DeprecationWarning",
    # httpx ``data=``→``content=`` upload deprecation, triggered TEST-side by the
    # ``client.post(..., data=[(...)])`` calls in test_web/test_calendars_route.py
    # (not product code). Tracked: migrate those calls to ``content=``.
    "ignore:Use 'content=<...>' to upload raw bytes/text content.:DeprecationWarning",
    # uvicorn pulls in the legacy ``websockets`` impl when it spins up the e2e
    # server thread (tests/e2e drives a real uvicorn), which emits a FAMILY of
    # "websockets.<x> is deprecated" warnings (websockets.legacy,
    # websockets.server.WebSocketServerProtocol, …). All THIRD-PARTY + un-fixable
    # by us (uvicorn's own dep on the legacy impl); email-triage is a pure-HTTP app
    # and never imports websockets directly, so masking the whole family is safe.
    # Without this the gate elevates them to an ERROR *in the server thread*,
    # crashing uvicorn at import so /health never responds and EVERY e2e test fails
    # at server-readiness. One regex covers the family. Drop once uvicorn/websockets
    # stop importing the legacy module.
    "ignore:websockets.* deprecated:DeprecationWarning",
    # ResourceWarning (unclosed database) — the 591-strong dominant bucket is left
    # at the pytest DEFAULT action (shown, NOT error) on purpose: it is pervasive
    # TEST-fixture hygiene across ~150 in-body ``init_db()`` openers (GC-attributed,
    # so unpinnable per-site), and PRODUCT code is audited leak-free (every
    # ``open_dedicated_conn`` closes via try/finally). Test fixtures/helpers funnel
    # through ``tests/_db_tracking.track()`` + the autouse closer in conftest — use
    # that funnel when you touch a leaking opener. Forcing ``error`` here would fail
    # CI on 591 pre-existing test-only warns with no product risk. bucket 1.
    # ResourceWarning: unclosed event loop — Windows-LOCAL-only noise (asyncio
    # ``ProactorEventLoop``, GC-attributed at interpreter teardown from the
    # pytest-asyncio / harness loop lifecycle, NOT product code and NOT the
    # unclosed-database hygiene bucket above). Linux CI uses ``SelectorEventLoop``
    # and never emits it, so it only surfaces in a local Windows audit run.
    # Scoped to the exact message so it can never mask the SHOWN unclosed-database
    # bucket. bucket 5 (folded 2026-06-14 audit).
    "ignore:unclosed event loop:ResourceWarning",
]
# Resolve ``email_triage`` from this worktree's local ``src/`` regardless
# of which sibling worktree's editable install last claimed the shared
# site-packages ``.pth`` file. Removes the need for ``PYTHONPATH=src``.
# ``tests`` is on the path so the structural-drift pins can ``from
# _pin_harness import ...`` (the shared count-agnostic-pin harness,
# tests/_pin_harness.py) without a per-pin sys.path shim.
pythonpath = ["src", "tests"]
