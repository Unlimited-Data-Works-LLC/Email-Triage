# Alembic configuration for email-triage v0.1.2 single-file encryption.
#
# Canonical onboard pattern (verified per
# `internal documentation` §4 Phase 1 deliverable 4):
#   1. `alembic init alembic/` (this directory).
#   2. The initial revision (`versions/0001_baseline_v0_1_2.py`)
#      DELEGATES to the legacy `init_db()` for the full schema build —
#      its `upgrade()` calls `init_db()` directly rather than embedding
#      a reflected `.schema` snapshot (SA reflection mishandles
#      expression-DEFAULTs + INTEGER PRIMARY KEY inlining). This is NOT
#      `alembic revision --autogenerate` (which causes duplicate-table
#      errors per Alembic Cookbook when stamping an existing DB). There
#      is no extract script — the baseline IS the init_db() delegation.
#   3. `alembic stamp head` on production after deploy to mark the
#      already-migrated schema without re-running the baseline.
#
# Database URL is supplied at runtime by env.py from the application's
# settings (EMAIL_TRIAGE_DATABASE_URL env-var or the config-file value)
# so Alembic uses the SAME engine factory as the running app — that's
# the SQLCipher-aware `creator=` path from `db/_engine.py`.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is intentionally absent; env.py reads from app config.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
